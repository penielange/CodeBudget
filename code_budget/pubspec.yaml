name: code_budget
description: CodeBudget — Gestion budgétaire personnelle offline-first. Created by CodeAnytime.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  equatable: ^2.0.7
  collection: ^1.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.png
  web:
    generate: true
    image_path: assets/images/logo.png
  linux:
    generate: true
    image_path: assets/images/logo.png


flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
